services:
  # ==============================================================
  # 1. MAY CHU DICH VU NOI BO (UBUNTU SERVER - CRUSHFTP 10.6.0)
  # ==============================================================
  victim:
    image: nhom05-victim-crushftp:v1
    container_name: victim_server
    cap_add:
      - NET_ADMIN
    networks:
      flat_net:
        ipv4_address: 192.168.10.20

  # ==============================================================
  # 2. MAY KIEM THU (KALI LINUX ATTACKER - CUNG VUNG MANG PHANG)
  # ==============================================================
  attacker:
    image: nhom05-attacker-kali:v1
    container_name: attacker_kali
    cap_add:
      - NET_ADMIN
    depends_on:
      - victim
    networks:
      flat_net:
        ipv4_address: 192.168.10.10

networks:
  # Vung mang phang chua phan vung (192.168.10.0/24)
  flat_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
